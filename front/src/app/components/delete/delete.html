<div class="container">
  <h2 mat-dialog-title>Voulez-vous supprimer cet utilisateur ?</h2>

  <div mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Annuler</button>

    <button
      mat-raised-button
      type="button"
      style="background: red; color: white"
      (click)="delete()"
    >
      Confirmer
    </button>
  </div>

  <span *ngIf="servererror" style="color: red"> L'action a échoué ! </span>
</div>
