<div class="document-details">
  <!-- ========================= -->
  <!-- HEADER -->
  <!-- ========================= -->

  <div class="details-header">
    <div class="document-avatar">
      <mat-icon>description</mat-icon>
    </div>

    <div class="document-header-info">
      <h2>
        {{ document?.title }}
      </h2>

      <p>
        {{ document?.reference }}
      </p>
    </div>

    <button
      mat-icon-button
      class="close-button"
      type="button"
      (click)="close()"
      matTooltip="Fermer"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- ========================= -->
  <!-- BODY -->
  <!-- ========================= -->

  <div class="details-body" *ngIf="document">
    <!-- INFORMATIONS PRINCIPALES -->

    <div class="section">
      <!-- <h3>
        <mat-icon>description</mat-icon>
        Informations du document
      </h3> -->

      <div class="info-grid">
        <!-- <div class="info-item">
          <span class="label"> Identifiant </span>

          <span class="value"> #{{ document.id }} </span>
        </div> -->
        <div class="info-item">
          <span class="label"> Titre </span>
          <span class="value">
            {{ document.title }}
          </span>
        </div>

        <div class="info-item">
          <span class="label"> Référence </span>
          <span class="value reference-badge">
            {{ document.reference }}
          </span>
        </div>
        <div class="info-item">
          <span class="label"> Catégorie </span>
          <span class="value category-badge">
            {{ document.category }}
          </span>
        </div>

        <div class="info-item">
          <span class="label"> Service </span>
          <span class="value reference-badge">
            {{ document.dept_id }}
          </span>
        </div>


      </div>
    </div>

    <!-- GESTION DU DOCUMENT -->

    <div class="section">
      <!-- <h3>
        <mat-icon>folder</mat-icon>
        Gestion du document
      </h3> -->

      <div class="info-grid">
        <div class="info-item">
          <span class="label"> Statut </span>
          <span
            class="status-badge"
            [class.disponible]="document.status === 'Disponible'"
            [class.borrowed]="document.status === 'Emprunté'"
            [class.archived]="document.status === 'Archivé'"
          >
            <span class="status-dot"></span>
            {{ document.status }}
          </span>
        </div>

        <div class="info-item">
          <span class="label"> Description </span>
          <span>
            <span class="status-dot"></span>
            {{ document.desc }}
          </span>
        </div>
      </div>
      <div class="info-location" *ngIf="document.address.length">
        <mat-icon style="color: red;">location_on</mat-icon>
        <!-- <span class="label"> Localisation </span> -->
          <span class="role-badge" *ngFor="let el of document.address; let i = index">
            <span>&nbsp;&nbsp;&nbsp;>>>&nbsp;&nbsp;&nbsp;</span>
            {{ el }}
          </span>
      </div>
    </div>
  </div>

  <!-- ========================= -->
  <!-- FOOTER -->
  <!-- ========================= -->

  <div class="details-footer">
    <button mat-stroked-button type="button" (click)="close()">
      <mat-icon> close </mat-icon>

      Fermer
    </button>
  </div>
</div>
